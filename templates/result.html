<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>ඔබේ ප්රතිඵලය (Your Result)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f8f8;
            padding: 40px;
            text-align: center;
        }
        .box {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        h2 {
            color: red;
        }
        ul {
            text-align: left;
        }
        .pdf-btn {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>හෘද රෝග අනාවැකිය (Heart Prediction)</h1>
        <h2>{{ prediction }}</h2>

        <h3>ඔබට පහත උපදෙස් ලබා දිය හැකිය (You can give the following advices): </h3>
        <ul>
            {% for advice in advices %}
                <li>{{ advice }}</li>
            {% endfor %}
        </ul>

        <br>
        <a href="/" style="color: blue;">නැවත පරීක්ෂා කරන්න (Check again)</a><br>

        <!-- ✅ PDF Download Button -->
        <a href="/download-report" class="pdf-btn">PDF වාර්තාව බාගන්න (Download PDF Report)</a>
    </div>
</body>
</html>
